<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      한국어 웹폰트 CSS는 글자 범위 조각이 많아 크다. 렌더링을 막지 않도록 미리 받아 두었다가
      도착하면 적용한다. 그 전에는 시스템 글꼴로 먼저 그리고, 글꼴이 오면 바뀐다(display=swap).
      첫 화면 2초 목표(PRD) 때문에 웹폰트는 문제·제목용 명조체만 쓰고, UI 글꼴은 시스템 글꼴을 쓴다.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap"
      />
    </noscript>
    <title>상식 퀴즈</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
